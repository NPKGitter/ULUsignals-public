name: Deploy Static Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload files to S3
        run: |
          aws s3 sync . s3://ulusignals.com \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Invalidate CloudFront Cache
- name: Invalidate CloudFront Cache
  run: |
    aws cloudfront create-invalidation --distribution-id E180U27AUKKIF --paths "/*"
    aws cloudfront create-invalidation --distribution-id E17BQ71N33AWLW --paths "/*"
